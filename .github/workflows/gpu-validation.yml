name: FastVideo masked attention adapter CUDA validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, Windows, X64, fastvideo-gpu-978d4afe58]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    env:
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify source and GPU
        run: |
          & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' -c "import hashlib,pathlib; pairs=[('fastvideo/attention/backends/flash_attn.py','2401a84751c5e93cc4a828db8ccdb31237c2929e70677e19ca716dfb5ef44ff8'),('fastvideo/attention/backends/abstract.py','2a738821b0505b658f7b722ab217fe6ddd0d326329235b4bc390ae90317c880c'),('fastvideo/attention/backends/sdpa.py','48a8aaa8bf19592510156a9983f12fcc6e60bfb547fbab3134b17f4ec88330cb'),('fastvideo/tests/attention/test_flash_attn_no_pad_custom_op.py','c6779c8ebcda9d6982a0a11f508813dc29eed357b5252885bb3ec6a87480b90e'),('baseline_flash_attn.py','56ba56b87ee2d0e1e31704cd46b3788bf63511fc67c54806d6251fa66c94b259'),('fastvideo_gpu_adapter_validation_20261108.py','bb450da099c0193951c0ce702554d66f5854f37d8d86b89cd620ff8984fa26fc')]; assert all(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==s for p,s in pairs); print('All source hashes verified')"
          if ($LASTEXITCODE -ne 0) { throw 'Source hash verification failed' }
          Write-Host 'FastVideo source commit: 4731dfaed0ccee6c7a99893ccede648e16074300'
          Write-Host 'Original upstream commit: ce970eb715215c79a169658d7aa6c8a96e64891e'
          nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
          if ($LASTEXITCODE -ne 0) { throw 'nvidia-smi failed' }
          & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' -c "import torch; assert torch.cuda.is_available(); print('GPU:', torch.cuda.get_device_name(0), 'PyTorch:', torch.__version__, 'CUDA:', torch.version.cuda)"
          if ($LASTEXITCODE -ne 0) { throw 'CUDA check failed' }
      - name: Confirm the original backend fails
        run: |
          $env:PYTHONPATH = $env:GITHUB_WORKSPACE
          $baseline = Join-Path $env:RUNNER_TEMP ("fastvideo-baseline-" + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $baseline | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'fastvideo') -Destination $baseline -Recurse
          Copy-Item -LiteralPath 'baseline_flash_attn.py' -Destination (Join-Path $baseline 'fastvideo/attention/backends/flash_attn.py') -Force
          $env:FASTVIDEO_SOURCE_ROOT = $baseline
          $test = Join-Path $baseline 'fastvideo/tests/attention/test_flash_attn_no_pad_custom_op.py'
          $output = & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' -m pytest -p fastvideo_gpu_adapter_validation_20261108 --noconftest -o addopts='' $test -k test_backend_padding_mask_and_custom_scale -q --tb=short 2>&1 | Out-String
          $testExit = $LASTEXITCODE
          Write-Host $output
          if ($testExit -ne 1 -or $output -notmatch '12 failed, 6 passed') { throw 'Unexpected baseline result' }
          exit 0
      - name: Run patched adapter on CUDA
        run: |
          $env:PYTHONPATH = $env:GITHUB_WORKSPACE
          $env:FASTVIDEO_SOURCE_ROOT = $env:GITHUB_WORKSPACE
          $env:FASTVIDEO_TEST_FA_VERSION = '2'
          $test = Join-Path $env:FASTVIDEO_SOURCE_ROOT 'fastvideo/tests/attention/test_flash_attn_no_pad_custom_op.py'
          & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' -m pytest -p fastvideo_gpu_adapter_validation_20261108 --noconftest -o addopts='' $test -k test_backend_padding_mask_and_custom_scale -q --tb=short
          if ($LASTEXITCODE -ne 0) { throw 'Patched adapter tests failed' }
      - name: Check FA3 guard on CUDA
        run: |
          $env:PYTHONPATH = $env:GITHUB_WORKSPACE
          $env:FASTVIDEO_SOURCE_ROOT = $env:GITHUB_WORKSPACE
          $env:FASTVIDEO_TEST_FA_VERSION = '3'
          $test = Join-Path $env:FASTVIDEO_SOURCE_ROOT 'fastvideo/tests/attention/test_flash_attn_no_pad_custom_op.py'
          & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' -m pytest -p fastvideo_gpu_adapter_validation_20261108 --noconftest -o addopts='' $test -k test_backend_padding_mask_and_custom_scale -q --tb=short
          if ($LASTEXITCODE -ne 0) { throw 'Simulated FA3 guard tests failed' }

  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run repository hooks on changed files
        run: |
          python -m pip install pre-commit
          pre-commit run --files fastvideo/attention/backends/flash_attn.py fastvideo/tests/attention/test_flash_attn_no_pad_custom_op.py
